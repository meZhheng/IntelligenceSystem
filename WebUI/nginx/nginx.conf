worker_processes auto;
worker_rlimit_nofile 100000;    # 进程级别能打开的最大文件描述符

events {
    worker_connections  8192;     # 每个 worker 最多并发连接数
    multi_accept        on;       # 接受尽可能多的新连接
    use                 epoll;    # Linux 上高并发首选
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;

    # 保持客户端连接的超时时间
    keepalive_timeout      65;
    keepalive_requests     10000;

    client_max_body_size   1024m;

    # ---------------------------------------------------
    # upstream 定义
    # ---------------------------------------------------
    upstream flask_upstream {
        # 后端名称 backend 已在 /etc/hosts 或 docker compose 中映射到 172.18.0.5
        server backend:5000 max_fails=3 fail_timeout=30s;
        keepalive 64;            # 长连接池大小，可根据并发适当调大
    }

    # ---------------------------------------------------
    # Server 配置
    # ---------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;
        
        location / {
            try_files $uri /index.html;
        }

        # 代理 API 请求到 Flask
        location /api/ {
            proxy_pass http://flask_upstream/api/;
            # 使用 HTTP/1.1 和长连接
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            
            # ======== 超时相关 ========
            proxy_connect_timeout 600s;   # 建立到后端的连接超时（默认 60s）
            proxy_read_timeout    600s;   # 等待后端响应的超时（默认 60s）
            proxy_send_timeout    600s;   # 向后端发送请求体时的超时（默认 60s）
            send_timeout          600s;   # 响应客户端的超时

            # 保留原有头信息
            proxy_set_header    Host                $http_host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;

            # 取消代理缓冲（视业务而定，可开启以提高吞吐）
            proxy_buffering off;
        }

        location /rq/ {
            proxy_pass         http://flask_upstream/rq/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host                 $http_host;
            proxy_set_header   X-Real-IP            $remote_addr;
            proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto    $scheme;
        }

        location /apidocs/ {
            proxy_pass         http://flask_upstream/apidocs/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host                 $http_host;
            proxy_set_header   X-Real-IP            $remote_addr;
            proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto    $scheme;
        }

        location /flasgger_static/ {
            proxy_pass         http://flask_upstream/flasgger_static/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host                 $http_host;
            proxy_set_header   X-Real-IP            $remote_addr;
            proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto    $scheme;
        }

        location /apispec_1.json/ {
            proxy_pass         http://flask_upstream/apispec_1.json/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host                 $http_host;
            proxy_set_header   X-Real-IP            $remote_addr;
            proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto    $scheme;
        }

        location /static/ {
            proxy_pass         http://flask_upstream/static/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host                 $http_host;
            proxy_set_header   X-Real-IP            $remote_addr;
            proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto    $scheme;
        }
    }
}
